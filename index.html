<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dependency Viewer</title>
  <style>
:root {
  color-scheme: dark;
  font: 14px system-ui, sans-serif;
  color: #dce7f2;
  background: #10151d;
}

* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
[hidden] { display: none !important; }

#graph {
  position: fixed;
  inset: 0;
  overflow: hidden;
}
.graph-scene { position: absolute; inset: 0; }
#graph-background {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#graph-background circle { fill: #38495f; }
#graph { isolation: isolate; }
.diagram { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.atlas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.atlas-surface { position: absolute; pointer-events: none; transform-origin: 0 0; }
.atlas-input { position: absolute; inset: 0; touch-action: none; cursor: grab; }
.atlas-input:active { cursor: grabbing; }
.atlas-tooltip { position: absolute; max-width: min(300px, calc(100% - 16px)); overflow-wrap: anywhere; padding: 6px 9px; background: #192838; border: 1px solid #52708b; border-radius: 6px; color: #e5f0fb; pointer-events: none; font-size: 12px; }
.departing, .graph-scene > .diagram { position: absolute; inset: 0; }
.departing { pointer-events: none; }
.in-flight > rect, .in-flight .node-info { visibility: hidden; }
.diagram:active { cursor: grabbing; }
.card, .node-info, .wire { cursor: pointer; outline: none; }
.card, .card text { -webkit-user-select: none; user-select: none; }
.box { fill: #172434; stroke: #638caf; stroke-width: 1.4; }
.group .box { fill: #172a2c; stroke: #73a99d; }
.module .box { fill: #21253a; stroke: #969cc7; }
.label { fill: #f0f5fb; font: 600 15px ui-monospace, Consolas, monospace; }
.caption { fill: #a3b7cb; font-size: 11px; }
.label, .caption, .miniature, .preview-box, .preview-content { pointer-events: none; }
.preview-box { fill: #101c23; stroke: #38585a; }
.miniature .label { font-size: 17px; }
.labels-small .miniature .label { display: none; }
.miniature .line { stroke-width: 4; }
.card:hover > .box, .card:focus-visible > .box, .card.selected > .box, .card.endpoint > .box { stroke: #d0f5ff; stroke-width: 2.3; }
.card.wheel-preview > .box { stroke: #d0f5ff; stroke-width: 3; }
.card.wheel-preview > .preview-box { stroke: #94c5e7; stroke-width: 1.6; }
#back.wheel-preview { border-color: #d0f5ff; background: #2b425a; }
.card, .wire { transition: opacity 125ms cubic-bezier(0.23, 1, 0.32, 1); }
.card.dimmed { opacity: .32; }
.wire.dimmed { opacity: .14; }
.wire.marked .line { stroke: #a9e5ff; stroke-width: 3; }
.wire.related .line { stroke: #a9d3ef; }
.node-info { opacity: 0; }
.card:hover + .node-info, .node-info:hover, .node-info:focus-visible, .card:focus-visible + .node-info { opacity: 1; }
@media (hover: none) { .node-info { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card, .wire { transition: none; } }
.node-info rect { fill: #25384a; stroke: #668196; }
.node-info text { fill: #c7d9e9; text-anchor: middle; font-size: 13px; pointer-events: none; }
.node-info:hover rect, .node-info:focus-visible rect { stroke: #d0f5ff; }
.line { fill: none; stroke: #7396b8; stroke-width: 2; }
.hit { fill: none; stroke: transparent; stroke-width: 14; }
.wire:hover .line, .wire:focus-visible .line { stroke: #a9e5ff; stroke-width: 3.5; }
.diagram.show-neighbors > .cards > .card:not(.hover-neighbor, .pinned, .pin-neighbor) { opacity: .32; }
.diagram.show-neighbors > .wires > .wire:not(.hover-neighbor, .pinned) { opacity: .14; }
.card.hover-neighbor, .wire.hover-neighbor, .card.pin-neighbor, .card.pinned, .wire.pinned { opacity: 1; }
.card.pinned > .box { stroke: var(--pin-color); stroke-width: 3; }
.wire.pinned > .line { stroke: var(--pin-color); stroke-width: 3; }
.pulse { fill: #e0f7ff; pointer-events: none; }
.tool-icon { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; }
.icon-button { display: inline-grid; place-items: center; min-width: 34px; min-height: 34px; padding: 6px; }
.icon-button .tool-icon { margin: 0; vertical-align: 0; }
.copy.icon-button { min-width: 25px; min-height: 25px; }
#help-dialog { width: min(450px, calc(100vw - 24px)); background: #141e2a; color: inherit; border: 1px solid #40546a; border-radius: 10px; }
#help-dialog header { display: flex; justify-content: space-between; align-items: center; }
#help-dialog h2 { font-size: 16px; }
#help-dialog dl { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 9px 16px; align-items: baseline; }
#help-dialog dd { margin: 0; }
.viewer-settings { display: grid; gap: 8px; margin: 0; padding: 8px 12px 12px; border: 1px solid #40546a; border-radius: 6px; }
.viewer-settings label { display: flex; align-items: center; gap: 7px; }
.viewer-settings input { margin: 0; accent-color: #a5ceff; }
.key-combination { white-space: nowrap; }
kbd {
  display: inline-block;
  min-width: 1.9em;
  padding: 2px 5px;
  border: 1px solid #55728e;
  border-bottom: 2px solid #55728e;
  border-radius: 5px;
  background: #24364a;
  color: #eef6ff;
  font: 600 12px/1.35 ui-monospace, Consolas, monospace;
  text-align: center;
  white-space: nowrap;
}
@media (max-width: 420px) {
  #help-dialog dl { grid-template-columns: minmax(0, 1fr); row-gap: 6px; }
  #help-dialog dd + dt { margin-top: 6px; }
}
.card-icon { pointer-events: none; color: #9ec6ed; }
.group > .card-icon { color: #8fd7c2; }
.module > .card-icon { color: #c2baf4; }
.hover-flow { fill: none; stroke: #d4f4ff; stroke-width: 2.6; stroke-dasharray: 2 11; stroke-linecap: round; pointer-events: none; animation: flow-back .52s linear infinite; }
@keyframes flow-back { to { stroke-dashoffset: 13; } }
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .card > .preview-content { opacity: .86; transition: opacity 140ms cubic-bezier(.23, 1, .32, 1); }
  .card:hover > .preview-content { opacity: 1; }
  .tools button { transition: transform 125ms cubic-bezier(.23, 1, .32, 1); }
  .tools button:hover:not(:disabled) { transform: translateY(-1px); }
}
.atlas-controls { position: fixed; left: 16px; bottom: 61px; display: flex; flex-wrap: wrap; gap: 5px; max-width: min(500px, calc(100% - 32px)); z-index: 2; }
.atlas-controls button[aria-pressed="true"] { border-color: #9acaeb; background: #2a415a; }
.atlas-help { flex-basis: 100%; color: #c6daee; background: #141e2a; padding: 6px 9px; border-radius: 7px; }
.tools { position: fixed; top: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100vw - 32px); }
.tools { z-index: 2; }
.view-tabs { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid #40546a; border-radius: 10px; background: #141e2a; }
.view-tabs button { background: transparent; border-color: transparent; padding: 5px 8px; font-size: 12px; }
.view-tabs button[aria-selected="true"] { background: #2b425a; border-color: #577e9e; color: #f0f7ff; }
.view-tabs button:hover { background: #24374a; }
.view-tabs button { transition: background-color 125ms ease, border-color 125ms ease; }
.tools button[aria-pressed="true"] { border-color: #9acaeb; background: #2a415a; }
button:disabled { opacity: .42; cursor: default; }
#status { color: #bacfe4; background: #141e2a; border-radius: 7px; }
#status:not(:empty) { padding: 6px 8px; }
#minimap { position: fixed; right: 16px; bottom: 58px; width: 176px; height: 116px; border: 1px solid #40546a; border-radius: 8px; cursor: crosshair; }
@media (max-width: 720px) { #minimap { bottom: 160px; } }
.boundary { position: fixed; bottom: 60px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; }

.navigation, .zoom {
  position: fixed;
  bottom: 16px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.navigation { left: 16px; max-width: calc(100% - 175px); }
.zoom { right: 16px; }
#breadcrumb { background: #141e2a; padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; }
button {
  color: inherit;
  font: inherit;
  border: 1px solid #40546a;
  border-radius: 8px;
  background: #1b2939;
  padding: 7px 10px;
  cursor: pointer;
}
button:hover { background: #293e54; }
button:focus-visible { outline: 2px solid #a9e5ff; outline-offset: 2px; }
#details {
  position: fixed;
  top: 64px;
  right: 16px;
  bottom: 68px;
  width: min(440px, calc(100% - 32px));
  overflow: auto;
  background: #14202d;
  border: 1px solid #40546a;
  border-radius: 12px;
  box-shadow: 0 12px 40px #0008;
  padding: 16px;
}
#details header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
#details.details-left { right: auto; left: 16px; }
#details.details-beside-target { width: min(440px, calc(50% - 32px)); padding: clamp(6px, 2vw, 16px); }
#details h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
#details h3 { color: #b9d4eb; font-size: 13px; }
.muted { color: #adbed0; }
details { border-bottom: 1px solid #344354; padding: 8px 0; }
summary, .source { overflow-wrap: anywhere; }
summary { cursor: pointer; }
ul { padding-left: 18px; }
.source { color: #b6d8f9; font: 12px ui-monospace, Consolas, monospace; margin: 6px 0; }
.source-row { display: flex; align-items: flex-start; gap: 8px; }
.source-path { min-width: 0; overflow-wrap: anywhere; padding-top: 4px; }
.source-row .copy { flex: none; margin-left: 0; }
.source small { display: block; color: #b2bfd0; margin-top: 3px; }
@media (max-width: 740px) { #details { top: 108px; } }
.copy { font-size: 11px; padding: 2px 6px; margin-left: 8px; }
#search-bar { position: fixed; z-index: 4; left: 50%; top: 16px; transform: translateX(-50%); width: min(390px, calc(100vw - 32px)); display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #40546a; border-radius: 9px; background: #172333; }
#search-bar:focus-within { border-color: #83b4db; }
#search-glyph .tool-icon { margin: 0; }
#search-query { width: 100%; min-width: 0; padding: 8px 0; background: transparent; border: 0; outline: 0; font: inherit; color: inherit; }
#search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; display: grid; gap: 4px; max-height: min(46vh, 460px); overflow: auto; border: 1px solid #40546a; border-radius: 9px; padding: 6px; background: #14202d; box-shadow: 0 10px 28px #0006; }
@media (max-width: 1150px) { #search-bar { top: 60px; } #details { top: 108px; } }
@media (max-width: 440px) { #search-bar { top: 97px; } #details { top: 144px; } }
#search-results button { text-align: left; overflow-wrap: anywhere; }
#search-results button.active { background: #293e54; border-color: #88adc7; }
#search-results small { display: block; color: #adbed0; margin-top: 2px; }
#details, dialog, #search-results {
  transition: opacity 160ms cubic-bezier(.23, 1, .32, 1),
    transform 160ms cubic-bezier(.23, 1, .32, 1),
    display 160ms allow-discrete, overlay 160ms allow-discrete;
}
#details[hidden], dialog:not([open]), #search-results[hidden] { opacity: 0; }
#details[hidden] { transform: translateX(12px); }
dialog:not([open]) { transform: translateY(6px) scale(.98); }
#search-results[hidden] { transform: translateY(-4px); pointer-events: none; }
dialog::backdrop { background: #090f19b0; transition: opacity 160ms, display 160ms allow-discrete, overlay 160ms allow-discrete; }
dialog:not([open])::backdrop { opacity: 0; }
@starting-style {
  #details:not([hidden]) { opacity: 0; transform: translateX(12px); }
  dialog[open] { opacity: 0; transform: translateY(6px) scale(.98); }
  dialog[open]::backdrop { opacity: 0; }
  #search-results:not([hidden]) { opacity: 0; transform: translateY(-4px); }
}
@media (prefers-reduced-motion: reduce) {
  .view-tabs button { transition: none; }
  #details, dialog, dialog::backdrop, #search-results { transition-duration: 100ms; }
  #details[hidden], dialog:not([open]), #search-results[hidden] { transform: none; }
  @starting-style {
    #details:not([hidden]), dialog[open], #search-results:not([hidden]) { transform: none; }
  }
}
</style>
</head>

  <svg id="graph-background" aria-hidden="true">
    <defs>
      <pattern id="grid-tile" patternUnits="userSpaceOnUse" width="24" height="24" x="-6" y="-6" viewBox="0 0 2 2">
        <circle cx=".5" cy=".5" r=".1"/>
        <g class="grid-fine" opacity="0">
          <circle cx="1.5" cy=".5" r=".1"/>
          <circle cx=".5" cy="1.5" r=".1"/>
          <circle cx="1.5" cy="1.5" r=".1"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-tile)"/>
  </svg>
  <main id="graph" aria-label="Dependency graph"></main>
  <div id="search-bar" role="search">
    <span id="search-glyph" aria-hidden="true"></span>
    <input id="search-query" type="search" placeholder="Search modules, groups, or files" aria-label="Search graph" aria-controls="search-results" aria-expanded="false" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
    <div id="search-results" hidden></div>
  </div>
  <div class="tools" aria-label="Graph tools">
    <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Graph views">
      <button id="graph-tab" type="button" role="tab" aria-controls="graph" aria-selected="true">Graph</button>
      <button id="atlas-tab" type="button" role="tab" aria-controls="graph" aria-selected="false" tabindex="-1">Overview</button>
    </div>
    <button id="focus" type="button" aria-pressed="false" disabled>Focus</button>
    <button id="depth" type="button" hidden>1 level</button>
    <button id="path" type="button" aria-pressed="false" disabled>Path</button>
    <button id="open-data" type="button"></button>
    <button id="cycles" type="button"></button>
    <button id="help" type="button"></button>
    <input id="data-file" type="file" accept=".json,application/json" hidden>
    <span id="status" role="status"></span>
  </div>
  <nav class="navigation" aria-label="Graph navigation">
    <button id="back" type="button" hidden>← Back</button>
    <span id="breadcrumb" aria-live="polite"></span>
  </nav>
  <div id="atlas-controls" class="atlas-controls" aria-label="Overview levels" hidden>
    <button type="button" data-level="auto" aria-pressed="true">Auto</button>
    <button type="button" data-level="0" aria-pressed="false">Libraries</button>
    <button type="button" data-level="1" aria-pressed="false">Groups</button>
    <button type="button" data-level="2" aria-pressed="false">Modules</button>
    <button id="atlas-lines" type="button" aria-pressed="false" title="Show internal module connections when zooming in">Internal connections</button>
  </div>
  <div class="zoom" aria-label="View">
    <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="fit">Fit</button>
    <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <canvas id="minimap" width="176" height="116" hidden aria-label="Overview minimap"></canvas>
  <div id="boundary" class="boundary" aria-label="Graph boundaries" hidden></div>
  <aside id="details" aria-labelledby="detail-title" hidden>
    <header>
      <h2 id="detail-title"></h2>
      <button id="detail-close" aria-label="Close details">×</button>
    </header>
    <div id="detail-body"></div>
  </aside>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <header><h2 id="help-title">Keyboard shortcuts</h2><button id="help-close"></button></header>
    <dl>
      <dt><kbd>/</kbd> or <span class="key-combination"><kbd>Ctrl</kbd>/<kbd aria-label="Command key">⌘</kbd> + <kbd>F</kbd></span></dt><dd>Search</dd>
      <dt><span class="key-combination"><kbd>Alt</kbd> + <kbd>←</kbd></span> or <kbd>Mouse button 4</kbd></dt><dd>Back</dd>
      <dt><span class="key-combination"><kbd>Alt</kbd> + <kbd>→</kbd></span> or <kbd>Mouse button 5</kbd></dt><dd>Forward</dd>
      <dt><kbd>Esc</kbd></dt><dd>Close dialog, clear selection, or go back</dd>
      <dt><kbd>+</kbd> / <kbd>−</kbd></dt><dd>Zoom</dd>
      <dt><kbd>Mouse wheel</kbd></dt><dd>Zoom around the pointer</dd>
      <dt><kbd>0</kbd> or <kbd>F</kbd></dt><dd>Fit graph to view</dd>
      <dt><kbd>?</kbd></dt><dd>Keyboard shortcuts</dd>
    </dl>
    <fieldset class="viewer-settings">
      <legend>Settings</legend>
      <label><input id="wheel-navigation" type="checkbox" checked> Change level with the mouse wheel</label>
      <label><input id="double-click-navigation" type="checkbox"> Change level with a double-click</label>
    </fieldset>
  </dialog>

function indexBy(items, key) {
  const index = new Map();
  for (const item of items) {
    const id = key(item);
    if (!index.has(id)) index.set(id, []);
    index.get(id).push(item);
  }
  return index;
}

function relationIndex(edges) {
  return { outgoing: indexBy(edges, edge => edge.source), incoming: indexBy(edges, edge => edge.target) };
}

function neighbors(index, id, depth) {
  const nodes = new Set([id]);
  const edges = new Set();
  let frontier = [id];
  for (let level = 0; level < depth; level++) {
    const next = [];
    for (const node of frontier) {
      for (const edge of [...(index.outgoing.get(node) ?? []), ...(index.incoming.get(node) ?? [])]) {
        edges.add(edge.id);
        const other = edge.source === node ? edge.target : edge.source;
        if (nodes.has(other)) continue;
        nodes.add(other);
        next.push(other);
      }
    }
    frontier = next;
  }
  return { nodes, edges };
}

function findPath(index, start, end) {
  const previous = new Map([[start, null]]);
  const queue = [start];
  for (let i = 0; i < queue.length && !previous.has(end); i++) {
    for (const edge of index.outgoing.get(queue[i]) ?? []) {
      if (previous.has(edge.target)) continue;
      previous.set(edge.target, edge);
      queue.push(edge.target);
    }
  }
  if (!previous.has(end)) return null;
  const result = [];
  for (let edge = previous.get(end); edge; edge = previous.get(edge.source)) result.push(edge);
  return result.reverse();
}
return { indexBy, relationIndex, neighbors, findPath };
})();

function components(links) {
  const discovered = new Map();
  const stack = [];
  const active = new Set();
  const result = new Map();
  let order = 0;
  function visit(id) {
    const entry = { index: order, low: order };
    order++;
    discovered.set(id, entry);
    stack.push(id);
    active.add(id);
    for (const next of links.get(id)) {
      if (!discovered.has(next)) {
        visit(next);
        entry.low = Math.min(entry.low, discovered.get(next).low);
      } else if (active.has(next)) {
        entry.low = Math.min(entry.low, discovered.get(next).index);
      }
    }
    if (entry.low !== entry.index) return;
    let member;
    do {
      member = stack.pop();
      active.delete(member);
      result.set(member, id);
    } while (member !== id);
  }
  for (const id of links.keys()) if (!discovered.has(id)) visit(id);
  return result;
}

function cycleGroups(graph) {
  const links = new Map(graph.nodes.map(node => [node.id, []]));
  for (const edge of graph.edges) links.get(edge.source).push(edge.target);
  const groups = new Map();
  for (const [id, key] of components(links)) {
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(id);
  }
  return [...groups.values()].filter(group => group.length > 1);
}
return { components, cycleGroups };
})();

// The v1 interchange format describes a three-level graph independent of language.
// Adapt it to the same model used by scanner reports.

  if (input?.format !== 'dependency-viewer') {
    if (input?.version === 1 && input.libraries && input.modules &&

  const require = (ok, message) => { if (!ok) throw new Error(message); };
  const string = value => typeof value === 'string' && value.trim() === value && value.length > 0;
  const fields = (value, allowed, where) => {
    require(Object.keys(value).every(key => allowed.includes(key)), where + ': Unknown field.');
  };
  fields(input, ['format', 'version', 'name', 'nodes', 'edges'], 'Dataset');
  require(string(input.name), 'Missing name.');
  require(Array.isArray(input.nodes) && input.nodes.length > 0, 'nodes must contain at least one node.');
  require(Array.isArray(input.edges), 'edges must be an array.');
  const byId = new Map();
  function sources(items, where) {
    require(Array.isArray(items), where + ': sources must be an array.');
    for (const source of items) {
      require(source && string(source.path) && Number.isSafeInteger(source.line) && source.line >= 1,
        where + ': Source locations require path and line starting at 1.');
      fields(source, ['path', 'line'], where);

  for (const node of input.nodes) {

    fields(node, ['id', 'label', 'kind', 'parent', 'sources'], node.id);
    sources(node.sources === undefined ? [] : node.sources, node.id);
    byId.set(node.id, node);
  }
  const libraries = Object.create(null);
  const modules = Object.create(null);
  const groups = Object.create(null);
  for (const node of byId.values()) {
    const parent = byId.get(node.parent);
    if (node.kind === 'project') {
      require(node.parent === undefined, node.id + ': Project nodes cannot have a parent.');
      libraries[node.id] = { name: node.id, label: node.label, files: node.sources ?? [] };
    } else if (node.kind === 'group') {
      require(parent?.kind === 'project', node.id + ': parent must refer to a project.');
      groups[node.id] = { label: node.label, library: parent.id, files: node.sources ?? [] };
    } else {
      require(parent?.kind === 'group' && byId.get(parent.parent)?.kind === 'project',
        node.id + ': parent must refer to a group within a project.');

    const source = byId.get(edge.source);
    const target = byId.get(edge.target);
    require(source && target && source.kind === target.kind && ['project', 'item'].includes(source.kind),

  const populated = new Set(Object.values(modules).map(module => module.group));
  for (const group of Object.keys(groups)) require(populated.has(group), 'Group without items: ' + group);
  return { version: 1, generic: true, name: input.name, libraries, groups, modules, links, imports, includes: [] };

class ViewerHistory {
  #browser;
  #session;
  #entries;
  #index;

  constructor(browser) {
    this.#browser = browser;
    this.reset();
  }

  get current() { return this.#entries[this.#index]; }
  get previous() { return this.#entries[this.#index - 1]; }
  get index() { return this.#index; }
  get canGoBack() { return this.#index > 0; }
  get canGoForward() { return this.#index + 1 < this.#entries.length; }

  reset() {
    this.#session = crypto.randomUUID?.() ?? String(Date.now());
    this.#entries = [{ location: {} }];
    this.#index = 0;
    this.#browser.replaceState(this.#browserState(), '');
  }

  push(entry) {
    this.#index++;
    this.#entries.splice(this.#index, this.#entries.length, entry);
    this.#browser.pushState(this.#browserState(), '');
  }

  back() { if (this.canGoBack) this.#browser.back(); }
  forward() { if (this.canGoForward) this.#browser.forward(); }

  resolve(state) {
    if (state?.viewer === this.#session) return this.#entries[state.index];
  }

  activate(state) { this.#index = state.index; }

  #browserState() { return { viewer: this.#session, index: this.#index }; }
}
return { ViewerHistory };
})();

    const source = pathStart;
    if (source === node.id) {
      status.textContent = 'Choose a different node as the destination.';
      return;
    }
    const path = findPath(scene.index, source, node.id);
    pathStart = null;
    entry().path = path;
    entry().pathSource = source;
    entry().selected = node.id;
    emphasize();
    showPath(path, scene.nodes, source, node.id);
    status.textContent = path ? path.length + ' steps' : 'No directed path';
    return;
  }

  const pointer = event?.type === 'click' && event.detail > 0;
  const useDoubleClick = clickSetting.checked && pointer && node.next;
  const focusedGraph = entry().focused && !entry().location.atlas;
  if (!node.next || focusedGraph || event?.shiftKey || (useDoubleClick && event.detail !== 2)) {
    inspectNode(node, useDoubleClick ? event.clientX : undefined);
    return;
  }
  if (useDoubleClick) entry().selected = null;
  else if (atlasOrigin === undefined) entry().selected = node.id;
  entry().path = null;
  const miniature = box(node.id)?.querySelector('.miniature');
  const from = miniature ? screenRect(miniature) : null;
  push(node.next, { from }, { atlasOrigin });
}

function wheelNavigate({ delta, time, node, viewportShare, zoomedOut, screen }) {
  const duration = wheelPace(delta, time);
  const { library, group } = entry().location;
  const allowed = wheelSetting.checked && !pathStart && !entry().focused;
  const target = !allowed ? undefined
    : delta < 0 && node?.next && viewportShare >= .48 ? node.id
    : delta > 0 && library && zoomedOut >= 1.55 ? parentPreview : undefined;
  if (!wheelNavigation.sample(target, delta, time)) return;

  const reverse = target === parentPreview;
  const location = reverse ? group === undefined ? {} : { library } : node.next;
  const last = history.previous;
  const backEntry = reverse && last && !last.location.atlas &&
    last.location.library === location.library && last.location.group === location.group ? last : null;
  startWheelTransition(backEntry ?? { location }, {
    reverse, screen, parentId: group ?? library, childId: node?.id, duration,
  });
}

function push(location, motion = {}, state = {}) {
  cancelMotion();
  const oldAtlas = Boolean(entry().location.atlas);
  const newAtlas = Boolean(location.atlas);
  entry().view = viewport?.snapshot();
  history.push({ ...state, location });
  render(oldAtlas !== newAtlas ? { slide: newAtlas ? 1 : -1 } : motion);
}

const back = () => history.back();
const forward = () => history.forward();

window.addEventListener('popstate', event => {
  const next = history.resolve(event.state);
  if (!next) return;
  if (pendingWheelBack) {
    const settled = pendingWheelBack;
    pendingWheelBack = undefined;
    if (event.state.index === settled.index) {
      history.activate(event.state);
      finishWheelScene(settled);
      return;
    }
  }
  cancelMotion();
  const child = entry();
  child.view = viewport?.snapshot();
  const old = host.querySelector('.diagram');
  const nextAtlas = Boolean(next.location.atlas);
  const goingBack = event.state.index < history.index;
  const parentId = !next.location.library ? child.location.library
    : next.location.library === child.location.library && next.location.group === undefined ? child.location.group
    : undefined;
  const targetId = next.location.group ?? next.location.library;
  const preview = targetId && box(targetId)?.querySelector('.miniature');
  const motion = nextAtlas !== Boolean(child.location.atlas)
    ? { slide: nextAtlas ? 1 : -1, atlasOrigin: nextAtlas && goingBack ? child.atlasOrigin : undefined }
    : goingBack
      ? { from: old && screenRect(old), parentId, reverse: true }
      : { from: preview && screenRect(preview) };
  history.activate(event.state);
  render(motion);
});

function fromSearch(result) {
  const { node, location } = result;
  cancelMotion();
  if (entry().location.atlas && node.type === 'module' && viewport) {
    if (pathStart) openNode(node);
    else {
      entry().selected = node.id;
      entry().focused = true;
      entry().path = null;
      emphasize();
    }
    viewport.focus(node.id);
    status.textContent = node.id;
    return;
  }
  if (pathStart && scene.nodes.has(node.id) && JSON.stringify(location) === JSON.stringify(entry().location)) {
    openNode(node);
    return;
  }
  const changed = JSON.stringify(location) !== JSON.stringify(entry().location);
  if (changed) push(location);
  entry().selected = node.id;
  entry().focused = true;
  entry().path = null;
  emphasize();
  viewport.focus(node.id);
  status.textContent = node.id;
}

function cancelMotion() {
  wheelNavigation.cancel();
  wheelTransitions.cancel();
  stopTransition?.();
  stopTransition = null;
}

function refreshControls() {
  updateControls(select, host, entry(), { data, model, canGoBack: history.canGoBack, pathStart, atlasLevel });
}

function showBoundaries(location, graph) {
  renderBoundaries(select('boundary'), host, model.boundaries(location, graph));
}

function emphasize() {
  renderSelection(host, viewport, scene, entry());
  refreshControls();
}

function render(motion = null) {
  const run = ++generation;
  cancelMotion();
  const state = entry();
  const location = state.location;
  if (location.atlas && !atlasArrangement) {
    status.textContent = 'Preparing overview…';
    prepareAtlasOnce().then(() => {
      if (run === generation) render(motion);
    });
    return;
  }
  const outgoing = motion ? host.firstElementChild : null;
  const previous = outgoing?.querySelector('.diagram');
  const anchor = motion?.from && {
    x: motion.from.left + motion.from.width / 2, y: motion.from.top + motion.from.height / 2,
  };
  const previousGrid = grid.rebase(outgoing && previous && !location.atlas && !motion.slide
    ? motion.reverse ? 1 / 1.18 : 1.18 : 1, anchor ?? { x: host.clientWidth / 2, y: host.clientHeight / 2 });
  viewport?.destroy();
  viewport = null;
  pathStart = null;
  status.textContent = '';
  closeDetails();
  select('boundary').hidden = true;
  refreshControls();
  const panel = document.createElement('div');
  panel.className = 'graph-scene';
  host.replaceChildren(panel);
  if (location.atlas) {
    const graph = model.full();
    scene = { index: graph.index, nodes: new Map(graph.nodes.map(node => [node.id, node])) };
    viewport = mountAtlas(panel, atlasArrangement, graph, model.view().edges, {
        pins,
        cameraScale: grid.update,
        level(level) { atlasLevel = level; updateAtlasControls(select, entry(), atlasLevel); },
        mode(level) { state.fixedLevel = level; updateAtlasControls(select, entry(), atlasLevel); },
        inspect: showConnection,
        select(node, event) {
          const target = node.type === 'module' ? node : { ...node, next: { library: node.library, group: node.group } };
          openNode(target, event, node.id);
        },
    });
    if (state.view) viewport.restore(state.view);
    viewport.setLevel(state.fixedLevel ?? null);
    viewport.showLines(Boolean(state.showLines));
    if (motion?.atlasOrigin !== undefined) viewport.center(motion.atlasOrigin);
    emphasize();
    viewport.paint();
    animateScene(outgoing, previous, panel, null, motion, previousGrid);
    return;
  }

  const graphScene = mountGraph(panel, state);
  ({ viewport, scene } = graphScene);
  if (motion?.reverse && motion.parentId !== undefined) viewport.center(motion.parentId);
  if (location.library) showBoundaries(location, graphScene.graph);
  emphasize();
  animateScene(outgoing, previous, panel, graphScene.svg, motion, previousGrid);
}

function mountGraph(panel, state) {
  return diagram.mount(panel, state, {
    pins, openNode, inspectNode, cameraScale: grid.update, wheelNavigate,
    inspectEdge(edge, source, target) {
      state.path = [edge];
      state.pathSource = edge.source;
      state.selected = edge.target;
      emphasize();
      showConnection(edge, source, target);
    },
  });
}

function previewRect(card) {
  const miniature = card?.querySelector('.miniature');
  return miniature ? screenRect(miniature) : card?.getBoundingClientRect();
}

const wheelTransitions = createWheelTransitions({
  host, grid, mountGraph,
  getViewport: () => viewport,
  getPreviewRect: id => previewRect(box(id)),
  onArrival({ to, panel, incoming, previousView }) {
    entry().view = previousView;
    ({ viewport, scene } = incoming);
    closeDetails();
    if (to === history.previous) {
      to.view = viewport.snapshot();
      pendingWheelBack = { index: history.index - 1, panel, graph: incoming.graph };
      history.back();
    } else {
      history.push(to);
      finishWheelScene({ panel, graph: incoming.graph });
    }
  },
});

function startWheelTransition(to, motion) {
  cancelMotion();
  wheelTransitions.start(to, motion);
}

function finishWheelScene({ panel, graph }) {
  panel.inert = false;
  select('boundary').hidden = true;
  if (entry().location.library) showBoundaries(entry().location, graph);
  emphasize();
}

function animateScene(outgoing, previous, panel, svg, motion, previousGrid) {
  if (!outgoing || !motion) return;
  if (motion.slide || !previous || !svg) {
    host.prepend(outgoing);
    stopTransition = slideScene(outgoing, panel, motion.slide ?? -1);
  } else {
    const destination = motion.reverse ? previewRect(box(motion.parentId)) : screenRect(svg);
    stopTransition = transitionGraph(host, previous, svg, motion.from, destination, motion.reverse, {
      animateGrid: timing => grid.animateFrom(previousGrid, timing),
    });
  }
}

const openSearch = enableSearch(query => model.search(query), fromSearch);
select('search-glyph').append(icon('search'));
function prepareAtlasOnce() {
  if (atlasArrangement) return Promise.resolve(atlasArrangement);
  if (!atlasTask) {
    const currentModel = model;
    atlasTask = prepareAtlas(model.full().nodes, model.view().nodes).then(arrangement => {
      if (currentModel === model) atlasArrangement = arrangement;
      return arrangement;
    });
  }
  return atlasTask;
}

async function switchTab(atlas) {
  const request = ++tabRequest;
  const initial = entry();
  const state = entry();
  if (Boolean(state.location.atlas) === atlas) {
    if (status.textContent === 'Preparing overview…') status.textContent = '';
    return;
  }
  if (atlas && !atlasArrangement) {
    status.textContent = 'Preparing overview…';
    await prepareAtlasOnce();
    if (request !== tabRequest || initial !== entry()) return;
  }
  const saved = { ...state, view: viewport?.snapshot() };
  if (atlas) graphTabState = saved;
  else atlasTabState = saved;
  const next = atlas ? atlasTabState : graphTabState;
  push(next?.location ?? (atlas ? { atlas: true } : {}), {}, next);
}
select('focus').onclick = () => {
  entry().focused = !entry().focused;
  entry().path = null;
  status.textContent = entry().focused && !entry().selected ? 'Choose a node to focus on.' : '';
  emphasize();
};
select('depth').onclick = () => {
  entry().depth = entry().depth === 2 ? 1 : 2;
  emphasize();
};
select('path').onclick = () => {
  const state = entry();
  closeDetails();
  if (state.path) state.path = null;
  pathStart = pathStart ? null : state.selected;
  status.textContent = pathStart ? 'Choose the path destination in this view.' : '';
  emphasize();
};
function replaceDataset(imported, importedModel) {
  data = imported;
  document.title = data.name + ' · Dependency Viewer';
  model = importedModel;
  history.reset();
  atlasTask = null;
  atlasArrangement = null;
  tabRequest++;
  graphTabState = atlasTabState = undefined;
  diagram.clear();
  pins.clear();
  render({ slide: 1 });
}

bindDatasetPicker(select('open-data'), select('data-file'), {
  accept: replaceDataset,
  reportError(message) { status.textContent = message; },
});
select('cycles').onclick = () => {
  const graph = model.full();
  const byId = new Map(graph.nodes.map(node => [node.id, node]));
  showCycles(model.cycles().map(group => group.map(id => byId.get(id))), id => {
    const node = byId.get(id);
    fromSearch({ node, location: { library: node.library, group: node.group } });
  });
};
host.addEventListener('pointerdown', cancelMotion, { capture: true });
// Some browsers deliver a whole wheel gesture to its original target. Keep
// routing on the persistent graph container as the scene underneath changes.
host.addEventListener('wheel', event => {
  if (!viewport) return;
  event.preventDefault();
  const bounds = host.getBoundingClientRect();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? bounds.height : 1;
  const delta = event.deltaY * unit;
  if (!delta) return;
  if (wheelTransitions.handleWheel(event, bounds, delta)) return;
  viewport.wheel(event, bounds, delta, {
    navigate: !pendingWheelBack, aroundCenter: Boolean(pendingWheelBack),
  });
}, { passive: false });
function escape() {
  if (wheelTransitions.reverse() || wheelNavigation.cancel()) {
    return;
  }
  if (!select('details').hidden) dismissDetails();
  else if (pathStart || entry().path || entry().selected) {
    pathStart = null;
    entry().path = null;
    entry().selected = null;
    status.textContent = '';
    emphasize();
  } else back();
}

bindShortcuts({
  canGoBack: () => history.canGoBack,
  canGoForward: () => history.canGoForward,
  back, forward, openSearch, escape,
  zoom(factor) { cancelMotion(); viewport?.zoom(factor); },
  fit() { cancelMotion(); viewport?.fit(); },
  openHelp() { select('help-dialog').showModal(); },
});
bindViewControls(select, {
  switchTab, getEntry: entry, getViewport: () => viewport, back, dismissDetails,
  refreshAtlasControls: () => updateAtlasControls(select, entry(), atlasLevel),
  fit(animate) { cancelMotion(); viewport?.fit(animate); },
  zoom(factor) { cancelMotion(); viewport?.zoom(factor); },
});
wheelSetting.addEventListener('change', cancelMotion);
initializeControlIcons(select);
render();
return {  };
})();
</script>
</body>
</html>
